# «Читанка — Книжки»: кураторський список творів для OPDS-каталогу.
#
# Кожен запис — один EPUB, який build.py генерує з uk.wikisource через WS Export
# (https://ws-export.wmcloud.org), чистить і публікує в public/.
#
# Поля:
#   slug          ASCII-ім'я файлів (books/<slug>.epub, covers/<slug>.jpg)
#   page          назва сторінки на uk.wikisource (саме її бере WS Export)
#   title         назва для dc:title, фіду й обкладинки
#   subtitle      жанр / підзаголовок (обкладинка й анотація)
#   author        ім'я автора для dc:creator і обкладинки
#   author_died   рік смерті автора (строк 70 p.m.a. в Україні)
#   edition       видання, з якого вичитано текст на Вікіджерелах
#     city/publisher/year  — як у шаблоні {{заголовок}}; year=null, якщо скану немає
#   source_note   (опційно) замість рядка видання, якщо скану немає
#   hold          (опційно) причина, чому книжку НЕ публікувати
#   pd_status     коротке пояснення статусу суспільного надбання (для сторінки подяк)
#   us_only_edition  true -> видання PD лише у США (Commons: PD-US-no notice).
#                 build.py прибирає ВСІ ілюстрації і ВСІ виноски, крім явно
#                 авторських (див. keep_note_markers), бо редакторський апарат
#                 таких видань поза США може бути захищений.
#   keep_note_markers  підрядки, за якими виноска вважається авторською
#                 і лишається навіть у us_only_edition.
#   summary       коротка анотація українською (для фіду й лендингу)
#   notes         примітки для людини (не потрапляють у файли)
#
# НЕ ВКЛЮЧЕНО у v1 (свідомо):
#   - «Кобзар» (Т. Шевченко). На uk.wikisource немає сучасної вичитаної редакції:
#     «Кобзарь» 1876 (Прага) має «ъ» замість апострофа й одну главу на 1,7 МБ XHTML,
#     а видання 1921/1922/1934/1939 вичитані лише на 4–32 сторінки. Треба або
#     нормалізувати ъ→’ та ділити главу, або дочекатися вичитки «Кобзар (1922)».
#   - «Кайдашева сім'я» (І. Нечуй-Левицький). Єдина повна редакція на uk.wikisource —
#     Львів 1879, кулішівка («Зъідеш с крутоі гори…»), сучасному читачеві важко.
#     Скан 1922 р. (Київ–Ляйпціґ) має 0 транскрибованих сторінок. Сайти з сучасним
#     текстом мають невідоме походження — не беремо.

site:
  title: "Читанка — Книжки"
  subtitle: "Українська класика в суспільному надбанні для читалки «Читанка»"
  base_url: "https://danylor-212.github.io/chytanka-books/"
  author: "Читанка"
  page_size: 50   # у chytanka-main MAX_OPDS_FEED_ENTRIES = 50 — більше на сторінку не можна
  # Дата останньої зміни конвеєра. <updated> у фіді та dcterms:modified в EPUB =
  # max(ця дата, час ревізії на Вікіджерелах). Підніміть її, коли змінюєте обробку.
  pipeline_date: "2026-09-23T00:00:00Z"

