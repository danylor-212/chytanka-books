# «Читанка — Книжки»: English-language classics (41 fiction + 88 non-fiction).
#
# Inspired by the Onyx Boox Palma/“Picco”-style preload of public-domain classics.
# Selection rules (see README «English books»):
#   * every author AND translator died before 1954 (safe under life+70 worldwide)
#     and the text is public domain in the US (Standard Ebooks only publishes US-PD texts);
#   * primary source: Standard Ebooks (standardebooks.org, CC0), built from their public
#     GitHub source repositories with their own `se build` tool — we do NOT scrape
#     standardebooks.org/ebooks/*/downloads (their robots.txt disallows AI agents there);
#   * fallback: Project Gutenberg, only for key works SE does not have
#     (`gutenberg: <ebook number>`), kept with the full PG licence inside;
#   * every book gets a Chytanka typographic cover (SE cover paintings are only
#     "thought to be PD in the US" and are ~0.6 MB each; see README) and an
#     «About this edition» page saying it is derived from, not an official release of,
#     Standard Ebooks / Project Gutenberg.
#
# Fields: slug, se: <github repo> | gutenberg: <id>, title, author, author_sort,
#   author_died, translator(s) + translator_died, published (first publication),
#   category: fiction | non-fiction, subject, summary.
#
# Considered and EXCLUDED (death-year rule): Sun Tzu «The Art of War» (Lionel Giles †1958),
#   Rousseau «The Social Contract» (G. D. H. Cole †1959), Wittgenstein «Tractatus» (†1951, but
#   C. K. Ogden †1957), Aristotle «Nicomachean Ethics» (F. H. Peters — death year unverifiable;
#   replaced by «Politics», tr. William Ellis †1801), Pascal «Pensées» (PG edition carries
#   T. S. Eliot's introduction, Eliot †1965), W. E. B. Du Bois (†1963), Helen Keller (†1968),
#   Bertrand Russell (†1970), Einstein (†1955), Siegfried Sassoon (†1967), Max Beerbohm (†1956).

