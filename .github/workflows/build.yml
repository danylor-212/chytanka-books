name: Build & deploy catalogue

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * 1"   # weekly, Monday 03:17 UTC — picks up fixes made on uk.wikisource
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  EN_SEED_TAG: en-cache-2026-09-25   # release holding en-cache.tar (see README «English books»)

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 300   # hard stop well under the 6 h GitHub limit
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Unit tests
        run: python -m unittest discover -s tests -v

      - name: Standard Ebooks toolset (se build)
        # English books are built from github.com/standardebooks source with SE's own tool;
        # standardebooks.org download URLs are never used.
        run: pip install standardebooks

      - name: Seed English build cache (release asset)
        # Pre-built Standard Ebooks EPUBs keyed by SE source commit (built/<repo>.epub + .sha) and
        # the Project Gutenberg downloads, so a run never has to `se build` all 120 books.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/ws-cache/en"
          gh release download "$EN_SEED_TAG" -R "$GITHUB_REPOSITORY" -p en-cache.tar -D "$RUNNER_TEMP"
          tar -xf "$RUNNER_TEMP/en-cache.tar" -C "$RUNNER_TEMP/ws-cache/en"
          rm "$RUNNER_TEMP/en-cache.tar"
          echo "seeded: $(ls "$RUNNER_TEMP/ws-cache/en/built" | grep -c '\.epub$') SE builds"

      - name: Restore English build cache (newer builds from previous runs)
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/ws-cache/en
          key: en-books-${{ hashFiles('books-en.yaml') }}-${{ github.run_id }}
          restore-keys: |
            en-books-${{ hashFiles('books-en.yaml') }}-
            en-books-

      - name: Build EPUBs + OPDS feed
        # Fetches fresh exports from ws-export.wmcloud.org (polite: 2 s between books).
        # Exits non-zero if any EPUB fails the structural checks.
        # --refresh-en: `git ls-remote` every SE repo and rebuild only books whose source changed,
        # at most SE_MAX_REBUILDS per run (the rest keep their previous build until a later run),
        # each `se build` limited to SE_BUILD_TIMEOUT seconds.
        env:
          SE_MAX_REBUILDS: "12"
          SE_BUILD_TIMEOUT: "1800"
          SE_JOBS: "4"
        run: python build.py --cache "$RUNNER_TEMP/ws-cache" --refresh-en

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: epubcheck (gating)
        # Checks EVERY book (no early exit), prints a summary, fails if any book has errors or warnings.
        env:
          EPUBCHECK_VERSION: "5.3.0"
        run: |
          curl -sSL -o "$RUNNER_TEMP/epubcheck.zip" \
            "https://github.com/w3c/epubcheck/releases/download/v${EPUBCHECK_VERSION}/epubcheck-${EPUBCHECK_VERSION}.zip"
          unzip -q "$RUNNER_TEMP/epubcheck.zip" -d "$RUNNER_TEMP"
          python tools/epubcheck_all.py --jar "$RUNNER_TEMP/epubcheck-${EPUBCHECK_VERSION}/epubcheck.jar" public/books/*.epub

      - name: Build report
        if: always()
        run: cat build-report.json || true

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
