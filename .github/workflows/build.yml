name: Build & deploy catalogue

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * 1"   # weekly, Monday 03:17 UTC — picks up fixes made on uk.wikisource
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build EPUBs + OPDS feed
        # Fetches fresh exports from ws-export.wmcloud.org (polite: 2 s between books).
        # Exits non-zero if any EPUB fails the structural checks.
        run: python build.py --cache "$RUNNER_TEMP/ws-cache"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: epubcheck (gating)
        # Checks EVERY book (no early exit), prints a summary, fails if any book has errors or warnings.
        env:
          EPUBCHECK_VERSION: "5.3.0"
        run: |
          curl -sSL -o "$RUNNER_TEMP/epubcheck.zip" \
            "https://github.com/w3c/epubcheck/releases/download/v${EPUBCHECK_VERSION}/epubcheck-${EPUBCHECK_VERSION}.zip"
          unzip -q "$RUNNER_TEMP/epubcheck.zip" -d "$RUNNER_TEMP"
          python tools/epubcheck_all.py --jar "$RUNNER_TEMP/epubcheck-${EPUBCHECK_VERSION}/epubcheck.jar" public/books/*.epub

      - name: Build report
        if: always()
        run: cat build-report.json || true

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
